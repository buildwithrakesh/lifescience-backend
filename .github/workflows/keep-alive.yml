name: Keep Render Alive

on:
  schedule:
    # Runs every 12 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging Life Science Backend to prevent Render sleep..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://lifescience-backend.onrender.com/api/health)
          echo "Render HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Backend is awake and healthy!"
          else
            echo "Ping sent (status: $HTTP_STATUS)"
          fi
